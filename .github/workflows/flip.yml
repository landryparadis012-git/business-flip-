name: Flip Broker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile flip_broker.py

      - name: Flip Broker run (poll + daily discovery)
        run: python3 flip_broker.py
        env:
          FLIP_TG_TOKEN: ${{ secrets.FLIP_TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}

      - name: Commit memory
        run: |
          git config user.name "flip-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then echo "no state changes"; exit 0; fi
          git commit -m "state update [skip ci]" || true
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            git pull --rebase -X theirs --autostash origin main || (git rebase --abort || true)
            sleep 5
          done
          if [ "$ok" = "1" ]; then
            echo "state committed"
          else
            echo "⚠️ push failed after retries — state rebuilds next run, alerts unaffected"
          fi
