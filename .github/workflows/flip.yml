name: Flip Broker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flip
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile flip_broker.py

      - name: Flip Broker run (poll + daily discovery)
        run: python3 flip_broker.py
        env:
          FLIP_TG_TOKEN: ${{ secrets.FLIP_TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          HUB_URL: ${{ secrets.HUB_URL }}
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}

      - name: Commit memory
        run: |
          git config user.name "flip-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "state update [skip ci]"
          for i in 1 2 3; do git push && break || (git pull --rebase --autostash origin main; sleep 3); done
